<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#5b6478;--accent:#2f5bea;--line:#e3e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--card:#181e33;--text:#eef1fa;--muted:#9aa3bd;--accent:#7b9bff;--line:#2a3150}}
:root[data-theme="dark"]{--bg:#0e1220;--card:#181e33;--text:#eef1fa;--muted:#9aa3bd;--accent:#7b9bff;--line:#2a3150}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:20px}

.av{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;font-weight:600;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
h1{margin:0;font-size:24px}
p{margin:6px 0 24px;color:var(--muted)}
a.btn{display:block;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none;font-weight:500}
a.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
